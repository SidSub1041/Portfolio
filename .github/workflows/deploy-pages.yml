# Builds the portfolio site (this repository) and publishes it to GitHub Pages.
#
# One-time setup in the repository settings:
#   (Pages is enabled automatically by the configure-pages step below; if that step is refused,
#    set Settings → Pages → Build and deployment → Source: "GitHub Actions" once by hand.)
#   Nothing else: the site URL and base path are taken from the Pages configuration
#   (configure-pages below), so https://user.github.io/repo/, a user site and a custom domain all
#   work without variables. Settings → Pages → Custom domain: your-domain.com (and add public/CNAME
#   with the same name) when the domain is ready. Optional overrides: repository variables
#   SITE_URL and BASE_PATH.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enables GitHub Pages on the first run and reports where the site is served from:
      # the repository sub-path (https://user.github.io/repo/), the root of a user site, or a
      # custom domain once one is set in Settings -> Pages. The build uses that automatically.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables, when set, override what configure-pages reports.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
